<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>12 · Canvas map — PikoCI UX</title>
<link rel="icon" type="image/png" sizes="32x32" href="../logo/px/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../logo/px/favicon-16.png">
<link rel="stylesheet" href="shared/base.css">
<style>
  body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: #100d1a; color: #ddd8e8; }
  a { color: #9fb7ff; }
  header { flex: none; display: flex; gap: 14px; align-items: center; padding: 8px 16px; background: rgba(20,16,32,.9); border-bottom: 1px solid #2b2444; }
  header a { color: #a99fc5; } header a.on { color: #fff; font-weight: 700; }
  header .logo { font-weight: 700; color: #FFA300; }
  #stage { flex: 1; min-height: 0; overflow: hidden; cursor: grab; position: relative; }
  #stage.grabbing { cursor: grabbing; }
  #canvas { position: absolute; transform-origin: 0 0; }
  .island { position: absolute; background: #1b1630; border: 1px solid #352c58; border-radius: 12px; padding: 12px 14px; }
  .island h3 { margin: 0 0 4px; color: #fff; }
  .island .mut { color: #8d84a8; font-size: 12px; }
  svg text { font: 11px ui-monospace, Menlo, monospace; pointer-events: none; }
  .gnode { cursor: pointer; }
  .gnode:hover rect { stroke: #fff; stroke-width: 2; }
  .hud { position: absolute; right: 14px; top: 12px; background: rgba(20,16,32,.92); border: 1px solid #352c58; border-radius: 8px; padding: 10px 12px; width: 300px; z-index: 5; max-height: 75vh; overflow: auto; }
  .hud h4 { margin: 0 0 6px; color: #fff; }
  .lightwrap { background: #faf8f6; color: #1f1a16; flex: 1; overflow: auto; }
  .zoomctl { position: absolute; left: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 4px; z-index: 5; }
  .zoomctl button { width: 32px; height: 32px; font-size: 16px; background: #1b1630; color: #fff; border: 1px solid #352c58; border-radius: 6px; cursor: pointer; }
  .log { background: #0a0812; }
  footer { flex: none; padding: 5px 14px; background: #171230; font-size: 12px; color: #8d84a8; }
</style>
</head><body>
<div id="hdr"></div>
<div id="main" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
<footer><b>Variation 12 · Canvas map</b> (spatial: every pipeline is an island on one infinite pan/zoom map; the whole org is literally one picture) · <a href="index.html" style="color:#a99fc5">← all variations</a></footer>

<script src="shared/data.js"></script>
<script src="shared/proto.js"></script>
<script>
const { esc, st, fmtDur, ago, App, Pages } = P;
let cam = { x: 40, y: 20, z: 1 };
let hud = null; // {kind:'job'|'resource', team, pl, name}

function header(route) {
  const sec = route[0] || '';
  const l = (h, label, on) => `<a href="#/${h}" class="${on ? 'on' : ''}">${label}</a>`;
  document.getElementById('hdr').innerHTML = `<header><span class="logo"><img src="../logo/pikoci-logo.svg" alt="" style="height:1.1em;vertical-align:-0.18em"> PikoCI</span>
    ${l('', 'Map', sec === '' || sec === 'b')} ${l('teams', 'Teams', sec === 'teams')}
    ${l('workers', 'Workers', sec === 'workers')} ${l('audit', 'Audit', sec === 'audit')}
    <span class="sp"></span>
    <span class="mut">${P.runningBuilds().length ? `<span class="st-started pulse">● ${P.runningBuilds().length} running</span>` : 'idle'}</span>
    ${l('settings', 'egon ⚙', sec === 'settings')}</header>`;
}

function islandSVG(pl) {
  const g = P.layoutGraph(pl, { nodeW: 118, nodeH: 30, resW: 100, resH: 22, gapX: 56, gapY: 14, pad: 8 });
  let svg = `<svg width="${g.w}" height="${g.h}">`;
  for (const e of g.edges) {
    const a = g.nodes[e.from], b = g.nodes[e.to];
    if (!a || !b) continue;
    const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2, mx = (x1 + x2) / 2;
    svg += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="#3d3366" stroke-width="1.5"/>`;
  }
  for (const [nm, n] of Object.entries(g.nodes)) {
    if (n.kind === 'resource') {
      const r = pl.resources.find(r => r.name === nm);
      const c = r.checkError ? '#FA8072' : (r.pinned ? '#FFA300' : '#554a80');
      svg += `<g class="gnode" onclick="window._hud('resource','${pl.team}','${pl.name}','${nm}')">
        <rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="11" fill="#241d40" stroke="${c}" stroke-width="1.5"/>
        <text x="${n.x + 8}" y="${n.y + 15}" fill="#a99fc5">${r.pinned ? '📌' : ''}${r.checkError ? '⚠' : ''}${esc(nm.split('.')[1] || nm)}</text></g>`;
    } else {
      const s = P.jobStatus(pl, nm);
      svg += `<g class="gnode ${s === 'started' ? 'pulse' : ''}" onclick="window._hud('job','${pl.team}','${pl.name}','${nm}')">
        <rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="4" fill="${st(s).color}"/>
        <text x="${n.x + 8}" y="${n.y + 19}" fill="#fff" font-weight="600">${esc(nm)}</text></g>`;
    }
  }
  return svg + '</svg>';
}

function mapView() {
  // lay islands out in rows by team
  let html = '', y = 20;
  for (const t of DATA.teams) {
    html += `<div class="island" style="left:20px;top:${y}px;background:none;border:none;padding:0"><h3 style="color:#554a80">▸ ${esc(t.name)}</h3></div>`;
    let x = 130;
    let rowH = 90;
    for (const pl of P.teamPipelines(t.name)) {
      const s = P.pipelineStatus(pl);
      const attn = P.pipelineAttention(pl);
      html += `<div class="island" style="left:${x}px;top:${y}px;border-color:${s === 'failed' || s === 'errored' ? '#FF004D' : (s === 'waiting_for_approval' ? '#8e44ad' : '#352c58')}">
        <h3><span class="st-${s} ${s === 'started' ? 'pulse' : ''}">${st(s).sym}</span> ${esc(pl.name)}
          ${pl.paused ? '<span class="st-paused" style="font-size:12px">❚❚</span>' : ''}</h3>
        <div class="mut">${esc(pl.desc)}${attn.length ? ' · <span class="st-failed">' + attn.length + ' issue(s)</span>' : ''}</div>
        <div style="margin-top:8px">${islandSVG(pl)}</div>
      </div>`;
      const g = P.layoutGraph(pl, { nodeW: 118, nodeH: 30, resW: 100, resH: 22, gapX: 56, gapY: 14, pad: 8 });
      x += g.w + 70;
      rowH = Math.max(rowH, g.h + 90);
    }
    y += rowH + 40;
  }
  const hudHTML = hud ? hudView() : '';
  return `<div id="stage">
      <div id="canvas" style="transform:translate(${cam.x}px,${cam.y}px) scale(${cam.z})">${html}</div>
      <div class="zoomctl">
        <button onclick="window._zoom(1.25)">+</button><button onclick="window._zoom(.8)">−</button>
        <button title="reset" onclick="cam={x:40,y:20,z:1};P.App.refresh()">⌂</button></div>
      ${hudHTML}
    </div>`;
}

function hudView() {
  const pl = P.getPipeline(hud.team, hud.pl);
  if (!pl) return '';
  if (hud.kind === 'resource') {
    const r = pl.resources.find(x => x.name === hud.name);
    return `<div class="hud"><h4>↻ ${esc(r.name)} <span class="mut">· ${esc(pl.name)}</span></h4>
      ${r.checkError ? `<div style="color:#ff9d9d;font-size:12px;margin-bottom:6px">⚠ ${esc(r.checkError)}</div>`
        : `<div class="mut">checked ${ago(r.lastCheck)} · every ${esc(r.checkEvery)}</div>`}
      ${r.versions.slice(0, 5).map(v => `<div style="display:flex;gap:6px;padding:3px 0;font-size:12px;align-items:center">
        <span>${r.pinned === v.ref ? '📌' : '·'}</span><code style="background:#241d40;color:#c9bfdd">${esc(String(v.ref).slice(0, 7))}</code>
        <span style="flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis" class="mut">${esc(v.msg || '')}</span>
        <button class="btn sm" data-act="pin|${hud.team}|${hud.pl}|${r.name}|${v.ref}">${r.pinned === v.ref ? 'unpin' : 'pin'}</button></div>`).join('')}
      <div style="margin-top:6px"><a href="javascript:void(0)" onclick="window._hud(null)">close</a></div></div>`;
  }
  const j = pl.jobs.find(x => x.name === hud.name);
  const builds = P.jobBuilds(pl, hud.name).slice(0, 6);
  const b = builds[0];
  return `<div class="hud"><h4><span class="st-${P.jobStatus(pl, hud.name)}">${st(P.jobStatus(pl, hud.name)).sym}</span> ${esc(hud.name)} <span class="mut">· ${esc(pl.name)}</span></h4>
    <div style="display:flex;gap:6px;margin:6px 0">
      <button class="btn sm primary" data-act="trigger|${hud.team}|${hud.pl}|${hud.name}">▶ trigger</button>
      <button class="btn sm" data-act="pauseJob|${hud.team}|${hud.pl}|${hud.name}">${j.paused ? 'unpause' : 'pause'}</button>
      ${b && b.status === 'waiting_for_approval' ? `<button class="btn sm primary" data-act="approve|${b.id}">⧖ approve</button>` : ''}</div>
    ${builds.map(x => `<div style="display:flex;gap:6px;padding:3px 0;font-size:12px">
      <span class="st-${x.status}">${st(x.status).sym}</span><a href="#/b/${x.id}">#${x.n}${x.job.includes('/') ? ' ' + x.job.split('/')[1] : ''}</a>
      <span class="mut" style="flex:1">${ago(x.start)}</span><span class="mut">${fmtDur(P.buildDur(x)) || ''}</span></div>`).join('')}
    <div style="margin-top:6px"><a href="javascript:void(0)" onclick="window._hud(null)">close</a></div></div>`;
}

function buildPage(id) {
  const b = P.getBuild(id);
  if (!b) return '<div class="pg">not found</div>';
  return `<div style="flex:1;overflow:auto" data-keep-scroll id="bp">
    <div style="display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid #2b2444">
      <a href="#/">← map</a>
      <b class="st-${b.status}">${st(b.status).sym} ${esc(b.pipeline)} / ${esc(b.job)} #${b.n}</b>
      ${P.buildMeta(b)}<span class="sp"></span>${P.buildActions(b)}</div>
    ${b.status === 'waiting_for_approval' ? `<div style="padding:8px 16px;color:#c39bd3">⧖ approval gate — 1/2 (maria ✓)</div>` : ''}
    <div style="padding:10px 16px">
    ${b.steps.map(sp => `<div style="margin-bottom:10px">
      <div style="display:flex;gap:8px;align-items:center;padding:4px 0">
        <span class="st-${sp.status} ${sp.status === 'started' ? 'pulse' : ''}">${st(sp.status).sym}</span>
        <span class="mut">${sp.type}</span><b style="color:#fff">${esc(sp.name)}</b>
        <span class="sp"></span><span class="mut">${sp.dur ? fmtDur(sp.dur) : ''}</span></div>
      ${sp.log.length ? P.renderLog(sp.log) : ''}</div>`).join('')}</div></div>`;
}

window._hud = (kind, team, pl, name) => { hud = kind ? { kind, team, pl, name } : null; App.refresh(); };
window._zoom = f => { cam.z = Math.min(Math.max(cam.z * f, .3), 2.5); App.refresh(); };

// pan handling (delegated, survives re-render)
let drag = null;
document.addEventListener('mousedown', e => {
  const stg = e.target.closest('#stage');
  if (!stg || e.target.closest('.hud') || e.target.closest('.gnode') || e.target.closest('.zoomctl')) return;
  drag = { sx: e.clientX, sy: e.clientY, ox: cam.x, oy: cam.y };
  stg.classList.add('grabbing');
});
document.addEventListener('mousemove', e => {
  if (!drag) return;
  cam.x = drag.ox + e.clientX - drag.sx;
  cam.y = drag.oy + e.clientY - drag.sy;
  const c = document.getElementById('canvas');
  if (c) c.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.z})`;
});
document.addEventListener('mouseup', () => { drag = null; const s = document.getElementById('stage'); if (s) s.classList.remove('grabbing'); });
document.addEventListener('wheel', e => {
  if (!e.target.closest('#stage') || e.target.closest('.hud')) return;
  e.preventDefault();
  window._zoom(e.deltaY < 0 ? 1.1 : 0.9);
}, { passive: false });

function render(r) {
  header(r);
  const m = document.getElementById('main');
  const [a, b] = r;
  const light = h => `<div class="lightwrap">${h}</div>`;
  if (!a) m.innerHTML = mapView();
  else if (a === 'b') m.innerHTML = buildPage(b);
  else if (a === 'teams') m.innerHTML = light(Pages.teams());
  else if (a === 'workers') m.innerHTML = light(Pages.workers());
  else if (a === 'audit') m.innerHTML = light(Pages.audit({ user: b }));
  else if (a === 'settings') m.innerHTML = light(Pages.settings());
  else m.innerHTML = light('<div class="pg">Not found</div>');
}
App.start(render);
</script>
</body></html>
