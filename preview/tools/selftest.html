<style>
  /* The harness chrome. Deliberately not using app.css classes, so a broken
     stylesheet still leaves a readable report. */
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #fff; color: #111; }
  #bar { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid #ddd;
         padding: 10px 16px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  #bar h1 { font-size: 15px; margin: 0; }
  #tally { font-weight: 700; }
  #tally.ok { color: #0a7d28; } #tally.bad { color: #b30016; }
  button { font: inherit; padding: 3px 10px; border: 1px solid #bbb; border-radius: 5px; background: #fafafa; cursor: pointer; }
  #out { padding: 8px 16px 40px; }
  .grp { margin: 14px 0 0; }
  .grp > summary { cursor: pointer; padding: 3px 0; font-weight: 600; }
  .grp[data-bad] > summary { color: #b30016; }
  .grp[data-bad="0"] > summary { color: #0a7d28; font-weight: 400; }
  .f { margin: 2px 0 2px 22px; font-size: 13px; }
  .f.fail::before { content: "✕ "; color: #b30016; font-weight: 700; }
  .f.warn::before { content: "! "; color: #a86500; font-weight: 700; }
  .f.pass::before { content: "✓ "; color: #0a7d28; }
  .f.warn { color: #7a4b00; }
  code { background: #f2f2f2; padding: 0 3px; border-radius: 3px; font-size: 12px; }
  /* The stage: views render here at a realistic width so widths and wraps are
     measurable. Off-screen rather than display:none — a hidden element has no
     layout, and half these checks are layout questions. */
  #stagewrap { position: absolute; left: -20000px; top: 0; width: 1280px; }
</style>
</head>

<script src="../views/build.js"></script>
<script src="../views/checks.js"></script>
<script src="../views/environments.js"></script>
<script src="../views/queue.js"></script>
<script src="../views/workers.js"></script>
<script src="../views/worker-detail.js"></script>
<script src="../views/audit.js"></script>
<script src="../views/teams.js"></script>
<script src="../views/settings.js"></script>
<script src="../views/gated.js"></script>
<script src="../routes.js"></script>
<script>
(function () {
  'use strict';

  const stage = document.getElementById('stage');
  const out = document.getElementById('out');

  // ---------- checks -------------------------------------------------------
  // Each check reads the rendered stage for one route and reports findings.
  // severity 'fail' breaks the build; 'warn' is a rule not fully adopted yet.

  const CHECKS = [];
  const check = (id, fn, severity) => CHECKS.push({ id, fn, severity: severity || 'fail' });

  check('table-overflow', () => {
    const bad = [];
    stage.querySelectorAll('.tbl-scroll').forEach((el, i) => {
      const over = el.scrollWidth - el.clientWidth;
      if (over > 1) bad.push(`table ${i + 1} overflows its container by ${over}px — a data table should fit, not scroll`);
    });
    return bad;
  });

  check('header-single-line', () => {
    const bad = [];
    stage.querySelectorAll('.tbl th').forEach(th => {
      // a wrapped header is ~2x line-height; 40px clears normal padding
      if (th.offsetHeight > 40 && th.textContent.trim()) bad.push(`header "${th.textContent.trim()}" wraps to two lines`);
    });
    return bad;
  });

  // Only inline action buttons. Step-jump rows (.step-head) are block buttons
  // that are supposed to be several lines tall.
  check('button-single-line', () => {
    const bad = [];
    stage.querySelectorAll('.btn').forEach(b => {
      const t = b.textContent.trim();
      if (!t) return;
      if (b.offsetHeight > 34) bad.push(`button "${t}" wraps (${b.offsetHeight}px tall) — its cell needs nowrap`);
    });
    return bad;
  });

  // One fill column per data table: the rest hug their content, so surplus
  // width has exactly one place to go. ui/table.js asserts this when it builds
  // a table; this catches any table built by hand that skipped it.
  check('one-fill-column', () => {
    const bad = [];
    stage.querySelectorAll('table.ctbl').forEach((t, i) => {
      const cg = t.querySelector('colgroup');
      let fills;
      if (cg) fills = [...cg.children].filter(c => !c.style.width).length;
      else {
        const row = t.querySelector('tr');
        if (!row) return;
        fills = [...row.children].filter(c =>
          c.style.width === '100%' || c.classList.contains('ct-title')).length;
      }
      if (fills !== 1) bad.push(`table ${i + 1} has ${fills} fill columns (want exactly 1)`);
    });
    return bad;
  });

  check('no-inline-handlers', () => {
    const bad = [];
    const seen = new Set();
    stage.querySelectorAll('*').forEach(el => {
      for (const a of el.attributes) {
        if (/^on/.test(a.name) && !seen.has(a.name + el.tagName)) {
          seen.add(a.name + el.tagName);
          bad.push(`<${el.tagName.toLowerCase()} ${a.name}=…> — should be data-act / data-state / data-nav`);
        }
      }
    });
    return bad;
  }, 'warn');

  check('links-resolve', () => {
    const bad = [];
    const known = new Set(ROUTES.ALL.map(r => r[0]));
    stage.querySelectorAll('a[href^="#/"]').forEach(a => {
      const r = ROUTES.parse(a.getAttribute('href'));
      try {
        if (!ROUTES.main(r)) bad.push(`${a.getAttribute('href')} renders nothing`);
      } catch (e) { bad.push(`${a.getAttribute('href')} throws: ${e.message}`); }
      void known;
    });
    return bad;
  });

  // ---------- docs-fidelity assertions (DOCS-FIDELITY.md) ------------------
  // Semantics that are easy to regress because they read as arbitrary wording.
  // where: 'text' reads rendered text, 'html' also sees title= and other
  // attributes (drain's explanation lives in a tooltip, not in the label).
  const FIDELITY = [
    ['b/pikoci/deploy/142', /waiting for approval/i, 'gated build says "waiting for approval"'],
    ['b/pikoci/deploy/142', /holds no worker|no worker|nothing has run/i, 'gated build states it holds no worker'],
    ['queue', /--concurrency/, 'queue explains --concurrency registers N single-build workers'],
    ['workers', /global workers skip/i, 'workers page states global-vs-team dispatch preference'],
    ['workers', /SIGQUIT|worker-side/, 'drain is described as worker-side', 'html'],
    ['changes/scheduled', /check_interval|cron/, 'scheduling is shown as a cron resource'],
  ];

  // Audit records what happened, so every action is past tense: build.approved,
  // pipeline.paused — never the imperative the button carried.
  check('audit-past-tense', () => {
    const bad = [];
    stage.querySelectorAll('td code').forEach(c => {
      const t = c.textContent.trim();
      if (/^(build|pipeline|resource|worker|token)\.(approve|reject|cancel|create|pause|pin|hold|release|update|delete|drain|supersede)$/.test(t))
        bad.push(`audit action "${t}" is imperative — the log records what happened, so it is past tense`);
    });
    return bad;
  });

  // ---------- graph routing invariants -------------------------------------
  // These are geometry, not markup, so they are checked once over every
  // pipeline rather than per route. Each one is a mistake that has been made:
  // a line passing behind a node, two wrap trunks crossing because their lanes
  // were ordered by something that was a tie, and an arrow head landing on top
  // of the curve that feeds it.
  function graphChecks() {
    const out2 = [];
    const { layout, OPTS } = PK.graph;
    for (const pl of window.DATA.pipelines) {
      let lay;
      try { lay = layout(pl); } catch (e) { out2.push(`${pl.name}: layout threw — ${e.message}`); continue; }
      const nodes = Object.entries(lay.pos).map(([n, q]) => Object.assign({ n }, q));

      // 1. no same-row edge crosses a node box
      for (const e of lay.flat) {
        const x1 = e.a.x + e.a.w, x2 = e.b.x;
        const inSpan = nodes.filter(q => q.n !== e.from && q.n !== e.to
          && q.row === e.a.row && q.x < x2 && q.x + q.w > x1);
        if (!inSpan.length) continue;
        const hit = e.detour
          ? inSpan.filter(q => q.y - 2 < e.detour.y && q.y + q.h + 2 > e.detour.y)
          : inSpan.filter(q => {
            const lo = Math.min(e.y1, e.y2), hi = Math.max(e.y1, e.y2);
            return q.y < hi + OPTS.detourClear && q.y + q.h > lo - OPTS.detourClear;
          });
        if (hit.length) out2.push(`${pl.name}: ${e.from} → ${e.to} passes through ${hit.map(h => h.n).join(', ')}`);
      }

      // 2. wrap trunks nest: channel order must match arrival order, or two
      //    routed lines cross somewhere along the gutter
      const byRow = {};
      for (const g of lay.wraps) (byRow[g.row] = byRow[g.row] || []).push(g);
      for (const [r, gs] of Object.entries(byRow)) {
        const arrivalY = g => g.kind === 'in' ? g.b.y + g.b.h / 2 : g.targets[0].p.y;
        const byChan = gs.slice().sort((p, q) => p.cy - q.cy).map(arrivalY);
        const sorted = byChan.slice().sort((p, q) => q - p);   // lowest channel = topmost target
        if (byChan.join() !== sorted.join())
          out2.push(`${pl.name} row ${r}: wrap lanes are not nested — channels ${byChan.map(Math.round).join(',')} arrive out of order`);
      }

      // 3. merge nodes follow their lanes: among fan-ins sharing a merge
      //    column, the one on the outermost lane (largest cy) must sit
      //    highest. Getting this backwards is what crossed delivery's lines.
      const cols = {};
      for (const g of lay.wraps) {
        if (g.kind !== 'in') continue;
        const c = Math.round(g.mx);
        (cols[c] = cols[c] || []).push(g);
      }
      for (const list of Object.values(cols)) {
        if (list.length < 2) continue;
        const byMerge = list.slice().sort((p, q) => p.my - q.my).map(g => Math.round(g.cy));
        const want = byMerge.slice().sort((p, q) => q - p);
        if (byMerge.join() !== want.join())
          out2.push(`${pl.name}: merge nodes do not follow their lanes — top-to-bottom they sit on channels ${byMerge.join(',')}`);
      }

      // 4. a source feeding several merge nodes must leave in the order those
      //    merge nodes sit, or its curves cross each other on the way out
      const perSource = {};
      for (const g of lay.wraps) {
        if (g.kind !== 'in') continue;
        for (const t of g.sources) (perSource[t.name] = perSource[t.name] || []).push({ port: g.srcY1[t.name], my: g.my });
      }
      for (const [name, list] of Object.entries(perSource)) {
        if (list.length < 2) continue;
        const byPort = list.slice().sort((p, q) => p.port - q.port).map(x => Math.round(x.my));
        const want = byPort.slice().sort((p, q) => p - q);
        if (byPort.join() !== want.join())
          out2.push(`${pl.name}: ${name}'s outgoing ports are not ordered by destination (${byPort.join(',')}) — its curves cross`);
      }

      // 5. a junction is a spine with spread ports, not a point — otherwise
      //    the last stretch of every line meeting there is drawn on top of
      //    itself — and two spines in one column must not overlap
      const spines = {};
      for (const g of lay.wraps) {
        const names = g.kind === 'in' ? g.sources : (g.targets.length > 1 ? g.targets : null);
        if (!names) continue;
        const x = Math.round(g.kind === 'in' ? g.mx : g.jx);
        const cy = g.kind === 'in' ? g.my : g.jy;
        const ys = names.map(t => g.portY[t.name]);
        if (new Set(ys.map(y => Math.round(y))).size !== ys.length)
          out2.push(`${pl.name}: junction for ${g.kind === 'in' ? g.to : g.from} stacks ${ys.length} lines on ${new Set(ys.map(Math.round)).size} port(s)`);
        (spines[x] = spines[x] || []).push({ lo: cy - g.jh / 2, hi: cy + g.jh / 2, n: g.kind === 'in' ? g.to : g.from });
      }
      for (const list of Object.values(spines)) {
        const sorted = list.slice().sort((p, q) => p.lo - q.lo);
        for (let i2 = 1; i2 < sorted.length; i2++)
          if (sorted[i2].lo < sorted[i2 - 1].hi)
            out2.push(`${pl.name}: junction spines for ${sorted[i2 - 1].n} and ${sorted[i2].n} overlap`);
      }

      // 6. an arrow head needs the corner, the run and the triangle to fit
      for (const g of lay.wraps) {
        if (g.kind !== 'in' && g.targets.length > 1) continue;   // fan-out arrives on a bezier
        const tgt = g.kind === 'in' ? g.b : g.targets[0].p;
        const need = OPTS.cornerR + OPTS.arriveRun + OPTS.headLen + OPTS.headGap;
        if (tgt.x - g.entryX < need - 0.5)
          out2.push(`${pl.name}: arrival into ${g.kind === 'in' ? g.to : g.targets[0].name} has ${Math.round(tgt.x - g.entryX)}px, needs ${need}`);
      }
    }
    return out2;
  }

  // ---------- runner -------------------------------------------------------
  function renderRoute(hash) {
    const route = ROUTES.parse(hash);
    stage.innerHTML = '';
    const html = ROUTES.shell(route) + ROUTES.main(route);
    stage.innerHTML = html;
    return html;
  }

  function run() {
    out.innerHTML = '';
    let fails = 0, warns = 0, routes = 0;

    // console errors during rendering are failures
    const realErr = console.error;
    const consoleErrors = [];
    console.error = function () { consoleErrors.push([...arguments].join(' ')); realErr.apply(console, arguments); };

    for (const [hash, label] of ROUTES.ALL) {
      routes++;
      const findings = [];
      let html = '';
      consoleErrors.length = 0;

      try {
        html = renderRoute(hash);
      } catch (e) {
        findings.push({ sev: 'fail', text: `render threw: ${e.message}` });
      }

      if (html) {
        for (const c of CHECKS) {
          let res = [];
          try { res = c.fn() || []; }
          catch (e) { res = [`check "${c.id}" threw: ${e.message}`]; }
          for (const r of res) findings.push({ sev: c.severity, text: `[${c.id}] ${r}` });
        }
        for (const [r, re, what, where] of FIDELITY) {
          if (r !== hash) continue;
          const hay = where === 'html' ? stage.innerHTML : stage.textContent;
          if (!re.test(hay)) findings.push({ sev: 'fail', text: `[fidelity] ${what}` });
        }
      }
      for (const e of consoleErrors) findings.push({ sev: 'fail', text: `[console] ${e}` });

      const nf = findings.filter(f => f.sev === 'fail').length;
      const nw = findings.filter(f => f.sev === 'warn').length;
      fails += nf; warns += nw;

      const d = document.createElement('details');
      d.className = 'grp';
      d.setAttribute('data-bad', String(nf));
      if (nf) d.open = true;
      d.innerHTML = `<summary>${nf ? '✕' : nw ? '!' : '✓'} <code>#/${hash}</code> ${label}` +
        `${nf ? ` — ${nf} failure${nf === 1 ? '' : 's'}` : ''}${nw ? ` · ${nw} warning${nw === 1 ? '' : 's'}` : ''}</summary>` +
        (findings.length
          ? findings.map(f => `<div class="f ${f.sev}">${f.text.replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]))}</div>`).join('')
          : '<div class="f pass">all checks pass</div>');
      out.appendChild(d);
    }

    // geometry invariants, checked once across every pipeline
    {
      let findings = [];
      try { findings = graphChecks().map(t => ({ sev: 'fail', text: t })); }
      catch (e) { findings = [{ sev: 'fail', text: 'graph checks threw: ' + e.message }]; }
      fails += findings.length;
      const d = document.createElement('details');
      d.className = 'grp';
      d.setAttribute('data-bad', String(findings.length));
      if (findings.length) d.open = true;
      d.innerHTML = `<summary>${findings.length ? '✕' : '✓'} <code>graph routing</code> geometry invariants over all ${window.DATA.pipelines.length} pipelines`
        + `${findings.length ? ` — ${findings.length} failure${findings.length === 1 ? '' : 's'}` : ''}</summary>`
        + (findings.length ? findings.map(f => `<div class="f fail">${f.text}</div>`).join('')
          : '<div class="f pass">no edge behind a node · lanes nested · merge nodes follow their lanes · ports ordered by destination · junction spines spread and clear · arrow heads clear</div>');
      out.appendChild(d);
    }

    console.error = realErr;
    stage.innerHTML = '';

    const t = document.getElementById('tally');
    t.textContent = `${routes} routes · ${fails} failure${fails === 1 ? '' : 's'} · ${warns} warning${warns === 1 ? '' : 's'}`;
    t.className = fails ? 'bad' : 'ok';
    document.getElementById('note').textContent = fails ? '' : 'warnings are rules not fully adopted yet — see STRUCTURE.md';
    return { routes, fails, warns };
  }

  // ---------- DOM snapshot -------------------------------------------------
  // Steps 1–3 of STRUCTURE.md are pure moves: take a snapshot before, compare
  // after, expect zero differences. Timestamps ("3m ago") and the live build
  // move on their own, so those are normalised out.
  function snapshot() {
    const snap = {};
    for (const [hash] of ROUTES.ALL) {
      let html;
      try { html = renderRoute(hash); } catch (e) { html = 'THREW: ' + e.message; }
      // Order matters: strip the random ids first, or the relative-time rule
      // below eats the "3d" inside "r-oymm3d" and the two runs disagree.
      snap[hash] = html
        .replace(/\br-[a-z0-9]{5,8}\b/g, '<rid>')             // random popover ids
        .replace(/\d+(\.\d+)?(s|m|h|d)( ago)?/g, '<t>')       // relative times
        .replace(/\d{1,2}:\d{2}(:\d{2})?/g, '<clock>')
        .replace(/width:\s*[\d.]+%/g, 'width:<pct>')          // live progress bars
        .replace(/\b\d{2,}%/g, '<pct>');
    }
    stage.innerHTML = '';
    return snap;
  }

  window.SELFTEST = { run, snapshot, renderRoute };

  document.getElementById('rerun').onclick = run;
  document.getElementById('snap').onclick = function () {
    const s = JSON.stringify(snapshot());
    navigator.clipboard.writeText(s).then(
      () => { this.textContent = `copied ${Math.round(s.length / 1024)}KB`; },
      () => { this.textContent = 'clipboard blocked'; });
  };

  run();
})();
</script>
</body>
</html>
